<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D_new 06 — CSS custom properties define insufficient focus color</title>
    <style>
      :root {
        --brand-primary: #6c757d;   /* gray — low contrast on white */
        --focus-ring-color: var(--brand-primary);
        --focus-ring-width: 2px;
      }
      body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #fff; }
      .form-group { margin-bottom: 1rem; }
      label { display: block; margin-bottom: 0.25rem; font-weight: 500; font-size: 0.9rem; }
      .form-control {
        display: block;
        width: 100%;
        max-width: 320px;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        background: #fff;
      }
      .form-control:focus {
        outline: var(--focus-ring-width) solid var(--focus-ring-color); /* #6c757d ≈ 3.0:1 — borderline fail */
        outline-offset: 1px;
      }
      .submit-btn {
        background: #0d6efd;
        color: #fff;
        border: none;
        padding: 0.5rem 1.25rem;
        border-radius: 0.375rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .submit-btn:focus {
        outline: var(--focus-ring-width) solid var(--focus-ring-color);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Contact us</h1>
    <form>
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" class="form-control" type="text" autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" class="form-control" type="email" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" class="form-control" rows="4"></textarea>
      </div>
      <button type="submit" class="submit-btn">Send message</button>
    </form>
  </body>
</html>
