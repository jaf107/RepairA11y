<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D_new 05 — Bootstrap-style button focus ring insufficient contrast</title>
    <style>
      /* Mimics Bootstrap 5's .btn:focus pattern — box-shadow instead of outline,
         but the shadow color (#6ea8fe at 50% opacity on #fff) fails 3:1 contrast */
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #fff; }
      .btn {
        display: inline-block;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 0.375rem;
        transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
      }
      .btn:focus {
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(110, 168, 254, 0.5); /* ~2.1:1 on white */
      }
      .btn-primary { background-color: #0d6efd; color: #fff; border-color: #0d6efd; }
      .btn-danger  { background-color: #dc3545; color: #fff; border-color: #dc3545; }
      .btn-success { background-color: #198754; color: #fff; border-color: #198754; }
      .card {
        border: 1px solid #dee2e6;
        border-radius: 0.375rem;
        padding: 1.25rem;
        max-width: 400px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Delete account</h1>
    <div class="card">
      <p>This action is permanent and cannot be undone.</p>
      <button class="btn btn-danger">Delete account</button>
      <button class="btn btn-success" style="margin-left:0.5rem">Keep account</button>
    </div>
    <p style="margin-top:1.5rem">
      <a href="#" style="color:#0d6efd">Learn more about data deletion</a>
    </p>
  </body>
</html>
