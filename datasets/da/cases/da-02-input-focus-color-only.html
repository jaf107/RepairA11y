<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D_new 02 — text input focus indicated by 1px color change only</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 1rem; }
      input.search {
        border: 1px solid #ccc;
        padding: 8px;
        font-size: 14px;
      }
      /* Focus indicator: only a 1px border color change — fails SC 2.4.13 (area + contrast). */
      input.search:focus {
        outline: none;
        border-color: #bbb; /* still only 1px, contrast vs #fff ≈ 1.3:1 */
      }
    </style>
  </head>
  <body>
    <h1>D_new 02 — input focus indicated by 1px color change only</h1>
    <label>Search: <input type="search" class="search" /></label>
  </body>
</html>
